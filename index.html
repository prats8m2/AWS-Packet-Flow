const blank=()=>({vpc:false,subnets:false,igw:false,publicIp:true,nat:false,s3ep:false,rt:{public:{def:null,s3:false},private:{def:null,s3:false}}});
const full=()=>({vpc:true,subnets:true,igw:true,publicIp:true,nat:true,s3ep:true,rt:{public:{def:'igw',s3:false},private:{def:'nat',s3:true}}});

let state=full(), chapter=0, ran=[];
const solved=new Set();
const ui={mode:'play',token:0,resume:null,last:null,running:false,flash:null,tag:null};

/* ---------- routing engine ---------- */
function lookup(s,rt,cls){
  const t=s.rt[rt];
  if(cls==='vpc') return {row:'local',target:'local',ok:true};
  if(cls==='s3'&&t.s3) return {row:'s3',target:'vpce',ok:s.s3ep};
  if(t.def) return {row:'def',target:t.def,ok:t.def==='igw'?s.igw:s.nat};
  return {row:null};
}
function build(id,s){
  const steps=[]; let pkt=null;
  const P=()=>({...pkt});
  const say=(node,badge,text)=>steps.push({t:'say',node,badge,text,pkt:P()});
  const move=(from,to)=>steps.push({t:'move',from,to,pkt:P()});
  const at=(node,badge,text)=>steps.push({t:'node',node,badge,text,pkt:P()});
  const end=(result,node,code,title,text,fix)=>{steps.push({t:'end',result,node,code,title,text,fix:fix||null});return{steps,result,code};};
  const look=(from,rt,cls)=>{move(from,'router');const r=lookup(s,rt,cls);steps.push({t:'lookup',rt,dst:pkt.dst,hasDef:!!s.rt[rt].def,...r});return r;};
  const blackhole=r=>end('drop','router','blackhole','Dropped: blackhole route',
    (r.target==='nat'?'The route still points to a NAT gateway, but that gateway has been deleted.':'The route still points to an internet gateway, but none is attached any more.')+' AWS marks routes like this as “blackhole”: packets that follow them vanish.',
    r.target==='nat'?'nat':'igw');

  if(id==='webApp'){
    pkt={src:IP.webPriv,dst:IP.app,kind:'req'};
    say('web','Sent','The web server asks the app server for data.');
    look('web','public','vpc'); move('router','app');
    at('app','Arrived','The app server receives the request and answers.');
    pkt={src:IP.app,dst:IP.webPriv,kind:'rep'};
    look('app','private','vpc'); move('router','web');
    return end('ok','web','local','Delivered without leaving the VPC','Every route table contains 10.0.0.0/16 to local, so any two servers in the VPC can reach each other with no gateway at all. That route is built in and can’t be removed.');
  }
  if(id==='visitorWeb'){
    pkt={src:IP.visitor,dst:IP.webPub,kind:'req'};
    say('internet','Sent','A visitor’s browser sends a request to your website’s public address.');
    move('internet','igw');
    if(!s.igw) return end('drop','igw','noIgw','Bounced off the VPC','The VPC has no internet gateway, so there is no way in. From the internet, your web server doesn’t exist.','igw');
    if(!s.publicIp) return end('drop','igw','noPublicIp','Dropped at the internet gateway','No server in the VPC owns the public address '+IP.webPub+'. The gateway only forwards traffic for public IPs it can map to a private one.','publicIp');
    pkt.dst=IP.webPriv;
    at('igw','Internet gateway','The internet gateway swaps the public destination for the server’s private address: '+IP.webPub+' becomes '+IP.webPriv+'.');
    move('igw','router'); move('router','web');
    at('web','Arrived','The web server receives the request and sends back the page.');
    pkt={src:IP.webPriv,dst:IP.visitor,kind:'rep'};
    const r=look('web','public','internet');
    if(!r.row) return end('drop','router','replyNoRoute','The request arrived, but the reply got lost','The gateway let the request in. The reply, though, needs a route out, and the public route table has nothing that matches '+IP.visitor+'. The router drops it and the visitor’s browser times out.','pubDef');
    if(!r.ok) return blackhole(r);
    move('router','igw'); pkt.src=IP.webPub;
    at('igw','Internet gateway','On the way out, the gateway puts the public address back as the source: '+IP.webPriv+' becomes '+IP.webPub+'.');
    move('igw','internet');
    return end('ok','internet','ok','Page delivered','The internet gateway let the request in, and the route 0.0.0.0/0 on the public route table showed the reply the way out. Both are needed.');
  }
  if(id==='internetApp'){
    pkt={src:IP.visitor,dst:IP.app,kind:'req'};
    say('internet','Sent','Someone on the internet tries to connect straight to the app server.');
    move('internet','igw');
    if(!s.igw) return end('blocked','igw','noIgw','Blocked at the edge of the VPC','There’s no internet gateway, so nothing from outside can enter the VPC at all.');
    return end('blocked','igw','privateBlocked','Blocked, exactly as intended','The app server has no public IP, so the internet gateway has nothing to map this packet to. '+IP.app+' is a private address that only means something inside the VPC.'+(s.nat?' The NAT gateway doesn’t help the stranger either: it only carries conversations that a private server started.':''));
  }

  const [src,cls]={webInternet:['web','internet'],appInternet:['app','internet'],appS3:['app','s3'],webS3:['web','s3']}[id];
  const isWeb=src==='web', subnet=isWeb?'public':'private', srcIp=isWeb?IP.webPriv:IP.app;
  const dstIp=cls==='s3'?IP.s3:IP.ext, dstNode=cls==='s3'?'s3':'internet';
  pkt={src:srcIp,dst:dstIp,kind:'req'};
  say(src,'Sent',{webInternet:'The web server calls an API out on the internet.',appInternet:'The app server asks an update server on the internet for a patch.',appS3:'The app server uploads a file to an S3 bucket.',webS3:'The web server fetches an image from an S3 bucket.'}[id]);

  let r=look(src,subnet,cls);
  if(!r.row){

  if(!r.ok) return blackhole(r);
  if(r.target==='nat'){
    move('router','nat'); pkt.src=IP.natPriv; viaNat=true;
    at('nat','NAT gateway','The NAT gateway replaces the source address with its own ('+srcIp+' becomes '+IP.natPriv+') and remembers the connection so it can return the reply.');
    r=look('nat','public',cls);
    if(!r.row) return end('drop','router','natNoRoute','Dropped after the NAT gateway','The NAT gateway forwarded the packet, but its own subnet has no route to an internet gateway. A NAT gateway only works from a public subnet.',s.igw?'pubDef':'igw');
    if(!r.ok) return blackhole(r);
  }
  if(r.target==='vpce'){
    move('router','vpce');
    at('vpce','Endpoint','The gateway endpoint carries the request to S3 over AWS’s private network. The source stays a private address.');
    move('vpce','s3'); exit='vpce';
  }else{
    move('router','igw');
    if(!viaNat&&!(isWeb&&s.publicIp)){
      return isWeb
        ? end('drop','igw','noPublicIp','Dropped at the internet gateway','The web server has no public IP, so the gateway has no public address to put on the packet. Private addresses can’t travel on the internet.','publicIp')
        : end('drop','igw','privateViaIgw','Dropped at the internet gateway','The route sent the app server’s packet straight to the internet gateway. The gateway only translates for servers that have a public IP, and the app server has none. Private servers go out through a NAT gateway instead.',s.nat?'privNat':'nat');
    }
    const old=pkt.src; pkt.src=viaNat?IP.natPub:IP.webPub;
    at('igw','Internet gateway',viaNat
      ? 'The internet gateway maps the NAT gateway’s address to its Elastic IP: '+old+' becomes '+pkt.src+'.'
      : 'The internet gateway swaps the private source for the server’s public IP: '+old+' becomes '+pkt.src+'.');
    move('igw',dstNode); exit='igw';
  }
  const seen=pkt.src;
  at(dstNode,cls==='s3'?'S3':'Arrived',cls==='s3'
    ? 'S3 checks the request against IAM and the bucket policy, then answers. It saw the request come from '+seen+'.'
    : 'The server on the internet answers. The only address it ever saw was '+seen+'.');
  pkt={src:dstIp,dst:seen,kind:'rep'};
  if(exit==='vpce'){ move('s3','vpce'); move('vpce','router'); }
  else{
    move(dstNode,'igw'); pkt.dst=viaNat?IP.natPriv:IP.webPriv;
    at('igw','Internet gateway','The internet gateway translates the destination back to a private address: '+seen+' becomes '+pkt.dst+'.');
    move('igw','router');
  }
  if(viaNat){
    move('router','nat'); pkt.dst=srcIp;
    at('nat','NAT gateway','The NAT gateway finds the connection it remembered and restores the real destination: '+srcIp+'.');
    look('nat','public','vpc');
  }
  move('router',src);
  if(exit==='vpce'&&!viaNat) return end('ok',src,'viaEndpoint','Delivered over the private endpoint','The request went from the VPC router straight to S3 through the gateway endpoint. It never touched the internet gateway or the NAT gateway, and gateway endpoints cost nothing.');
  if(exit==='vpce') return end('ok',src,'viaNatEndpoint','Delivered','The packet went to the NAT gateway first, then out through the endpoint route on the public route table.');
  if(viaNat&&cls==='s3') return end('ok',src,'viaNat','Delivered, the long way round','The file reached S3 through the NAT gateway and S3’s public endpoint. It works, but every gigabyte pays NAT processing charges. A gateway endpoint gives S3 traffic a direct, free path.');
  if(viaNat) return end('ok',src,'viaNat','Delivered through the NAT gateway','The app server got its update without ever being exposed. To the outside world the request came from '+IP.natPub+', the NAT gateway’s Elastic IP.');
  if(cls==='s3') return end('ok',src,'viaIgw','Delivered through the internet gateway','The web server reached S3’s public endpoint using its own public IP. The traffic stays on Amazon’s network, but it travels between public addresses.');
  return end('ok',src,'viaIgw','Delivered','The web server reached the internet through the internet gateway using its own public IP, and the reply came back the same way.');
}

function lookupText(st){
  const T=st.rt;
  if(!st.row) return 'The router checks the '+T+' route table for '+st.dst+'. Nothing matches.';
  const d={local:'10.0.0.0/16',def:'0.0.0.0/0',s3:'the S3 prefix list'}[st.row];
  const g={local:'local, so the packet stays inside the VPC',igw:'the internet gateway',nat:'the NAT gateway',vpce:'the S3 gateway endpoint'}[st.target];
  if(!st.ok) return 'The router checks the '+T+' route table. '+st.dst+' matches '+d+', which points to '+g+'. That target no longer exists.';
  return 'The router checks the '+T+' route table. '+st.dst+' matches '+d+', which points to '+g+'.'+(st.row==='s3'&&st.hasDef?' That route is more specific than 0.0.0.0/0, so it wins.':'');
}

const iso3=()=>document.documentElement.classList.contains('iso');
const RM3={'400,44':[400,-40],'400,490':[400,520],'150,490':[240,520]};
const R=(x,y)=>(iso3()&&RM3[x+','+y])||[x,y];
const LS=.64,LOX=404,LOY=26,P=(x,y)=>{[x,y]=R(x,y);return iso3()?{x:LS*(x-y)+LOX,y:LS*(x+y)/2+LOY}:{x,y};};
function buildDiagram(){
  $('#floor').setAttribute('transform',iso3()?'matrix(.64,.32,-.64,.32,404,26)':'matrix(1,0,0,1,0,0)');
  let e='';
  for(const k in EDGES){
    const d='M'+EDGES[k].map(p=>R(p[0],p[1]).join(' ')).join('L');
    e+=`<path class="edge" id="e-${k}" d="${d}"/><path class="edge-lit" id="l-${k}" d="${d}"/>`;
  }
  $('#edges').innerHTML=e;
  let n='';
  for(const k of Object.keys(NODES).sort((a,b)=>(NODES[a].x+NODES[a].y)-(NODES[b].x+NODES[b].y))){
    const o=NODES[k],q=P(o.x,o.y);
    n+=`<g class="node" id="n-${k}" data-info="${k}" transform="translate(${q.x} ${q.y})" tabindex="0" role="button" aria-label="${o.name}"><circle class="ring" r="30"/>${iso3()?'<path class="tile t-l" d="M-22 -13L0 -2L0 22L-22 11Z"/><path class="tile t-r" d="M22 -13L0 -2L0 22L22 11Z"/><path class="tile t-top" d="M0 -24L22 -13L0 -2L-22 -13Z"/><g class="icon" transform="matrix(.82,.41,-.82,.41,0,-13)">':'<rect class="tile t-flat" x="-24" y="-24" width="48" height="48" rx="'+(k==='router'||k==='internet'?24:12)+'"/><g class="icon">'}${ICONS[o.icon]}</g>`+
      LABELS[k].map(l=>`<text x="${l[0]}" y="${l[1]}" text-anchor="${l[2]}" class="${l[3]}"${l[5]?` id="${l[5]}"`:''}>${l[4]}</text>`).join('')+'</g>';
  }
  $('#nodes').innerHTML=n;
}

  const t=state.rt[rt], rows=[{row:'local',d:'10.0.0.0/16',ds:'10.0.0.0/16',t:'local',ts:'local',fixed:true}];
  if(t.s3) rows.push({row:'s3',d:'pl-63a5400a',note:'S3 prefix list',ds:'S3 prefix list',t:'S3 gateway endpoint',ts:'endpoint'});

function findings(D){
  const f=[],V=id=>by(D,'vpcs',id)||{name:id,cidr:''};
  D.subnets.forEach(s=>{

    if(s.kind==='private'&&pub)f.push({el:'subnet:'+s.id,text:s.name+' was created as a private subnet, but route table '+rt.name+' has a route to an internet gateway, which makes it public.'});
  });
  D.nodes.forEach(n=>{
    const s=by(D,'subnets',n.subnet),pub=isPublic(D,s);
    if(n.type==='nat'&&!pub)f.push({el:'node:'+n.id,text:'NAT gateway '+n.name+' sits in a subnet with no route to an internet gateway. A NAT gateway has to live in a public subnet.'});
    if(n.type==='ec2'&&n.pub&&!pub)f.push({el:'node:'+n.id,text:n.name+' has a public IP, but its subnet has no route to an internet gateway, so replies can’t get out.'});
    if(n.type==='rds'&&n.pub&&pub)f.push({el:'node:'+n.id,text:'Database '+n.name+' is publicly accessible and sits in a public subnet. Its security group is the only thing between it and the internet.'});
    if(n.type==='rds'&&n.pub&&!pub)f.push({el:'node:'+n.id,text:'Database '+n.name+' is marked publicly accessible, but its subnet has no route to an internet gateway, so the public address can’t be used.'});
    if(n.type==='alb'&&!by(D,'nodes',n.target))f.push({el:'node:'+n.id,text:'Load balancer '+n.name+' has no target server.'});
    if(n.type!=='nat'&&!(n.sgs||[]).length)f.push({el:'node:'+n.id,text:n.name+' has no security group, so nothing can reach it.'});
  });

const BASEW='A VPC with an internet gateway, a public subnet whose route table sends 0.0.0.0/0 to the gateway, and a private subnet with no such route. The networking basics lessons build each of these.';

    const acl={id:nid('acl'),vpc:v.id,name:'web-acl',def:false,rules:[{n:100,dir:'in',action:'allow',proto:'all',ports:'',cidr:'0.0.0.0/0'},{n:100,dir:'out',action:'allow',proto:'all',ports:'',cidr:'0.0.0.0/0'}]};

/* ---------- route table and firewall check card ---------- */
function tgtName(t){
  if(t==='local')return 'local';if(!t)return '(none)';
  const k=String(t).split('-')[0];
  if(k==='igw')return 'internet gateway';
  if(k==='nat'){const n=N(t);return n?'NAT '+n.name:t;}
  if(k==='vpce'){const e=D.gwes.find(x=>x.id===t);return e?E.SVC[e.service].name+' endpoint':t;}
  if(k==='pcx')return 'peering '+t;
  if(k==='tgw'){const g=D.tgws.find(x=>x.id===t);return g?'transit gateway '+g.name:t;}
  if(k==='vgw')return 'VPN gateway';
  return t;
}
const ruleTxt=r=>r.proto==='all'?'All traffic':r.proto==='icmp'?'ICMP':r.proto.toUpperCase()+' '+(String(r.ports||'').trim()||'all ports');
const peerTxt=p=>String(p).indexOf('sg-')===0?((SG(p)||{}).name||p):p;
const CHK0='<div class="chk-h"><b>Checks</b></div><p class="chk-empty">When a packet reaches a route table, network ACL or security group, its rules appear here with the one that decides highlighted.</p>';
function chkHide(){const c=$('#b-check');if(c){c.hidden=false;c.innerHTML=CHK0;}$$('#bsvg .chk-on').forEach(x=>x.classList.remove('chk-on'));}
function checkDetail(s){
  const t=s.ref.t,p=s.pkt;
  const pk=`<div class="chk-p"><span>${s.dir==='rep'?'Reply':'Request'}</span><b>${p.src} → ${p.dst}</b><i>${p.proto==='icmp'?'ICMP':p.proto.toUpperCase()+' port '+p.dport}</i></div>`;
  let h='',note='',ok=s.v!=='deny',el='';
  if(t==='rt'){
    const rt=RT(s.ref.id);if(!rt)return null;
    const sn=S(s.at.slice(3)),v=V(sn?sn.vpc:rt.vpc);if(!v)return null;
    const best=E.routeLookup(D,rt,v,p.dst);
    const len=r=>{if(String(r.dest).indexOf('pl-')===0){const sv=Object.values(E.SVC).find(x=>x.pl===r.dest);const c=sv&&sv.cidrs.map(E.cidr).find(c=>E.inC(p.dst,c));return c?c.len:null;}const c=E.cidr(r.dest);return c&&E.inC(p.dst,c)?c.len:null;};
    const rows=[{dest:v.cidr,target:'local',i:-1}].concat(rt.routes.map((r,i)=>({dest:r.dest,target:r.target,i})));
    h=`<div class="chk-h"><b>Route lookup</b><span>${esc(rt.name)}${sn?' · '+esc(sn.name):''}</span></div>${pk}<table><thead><tr><th>Destination</th><th>Target</th><th>Match</th></tr></thead><tbody>`+
      rows.map((r,j)=>{const m=len(r),win=!!best&&best.i===r.i&&best.route.dest===r.dest,bh=win&&r.target!=='local'&&!E.targetExists(D,rt,r.target);
        return `<tr class="${win?(bh?'bad':'win'):m!=null?'cand':'miss'}" style="animation-delay:${j*.16}s"><td>${esc(r.dest)}</td><td>${esc(tgtName(r.target))}</td><td>${win?(bh?'✕ blackhole':'✓ /'+m+' wins'):m!=null?'/'+m+' matches':'no'}</td></tr>`;}).join('')+'</tbody></table>';
    const nm=rows.filter(r=>len(r)!=null).length;
    note=!best?'No route covers '+p.dst+', so the router drops the packet.':(!ok?'The best match points to a target that no longer exists. That is a blackhole route.':(nm>1?nm+' routes cover '+p.dst+'. The longest prefix, the most specific one, wins.':'One route covers '+p.dst+'. The packet goes to '+tgtName(best.route.target)+'.'));
    el='rt:'+rt.id;
  }else if(t==='nacl'){
    const a=ACL(s.ref.id);if(!a)return null;
    const dirn=s.ref.dirn,ip=dirn==='in'?p.src:p.dst;
    const rules=a.rules.filter(r=>r.dir===dirn).sort((x,y)=>x.n-y.n);
    let hit=-1;rules.forEach((r,j)=>{if(hit<0&&E.protoOk(r.proto,p.proto)&&E.portOk(r,p.proto,p.dport)&&E.inC(ip,r.cidr))hit=j;});
    h=`<div class="chk-h"><b>Network ACL · ${dirn==='in'?'inbound':'outbound'}</b><span>${esc(a.name)}</span></div>${pk}<table><thead><tr><th>Rule</th><th>${dirn==='in'?'Source':'Destination'}</th><th>Traffic</th><th>Action</th></tr></thead><tbody>`+
      rules.map((r,j)=>`<tr class="${j===hit?(r.action==='allow'?'win':'bad'):hit>=0&&j>hit?'skip':'miss'}" style="animation-delay:${j*.2}s"><td>${r.n}</td><td>${esc(r.cidr)}</td><td>${esc(ruleTxt(r))}</td><td>${r.action}</td></tr>`).join('')+
      `<tr class="${hit<0?'bad':'skip'}" style="animation-delay:${rules.length*.2}s"><td>*</td><td>0.0.0.0/0</td><td>All traffic</td><td>deny</td></tr></tbody></table>`;
    note=hit<0?'No numbered rule matches, so the final * rule denies it.':'Rule '+rules[hit].n+' is the first match, so it decides: '+rules[hit].action+'. Rules after it are never checked.';
    if(s.dir==='rep')note+=' Network ACLs are stateless, so the reply is checked as a separate packet.';

  }else if(t==='sg'){
    const n=N(s.ref.node);if(!n)return null;

    const groups=(n.sgs||[]).map(SG).filter(Boolean);let won=false,j=0;
    h=`<div class="chk-h"><b>Security group · ${dirn==='inb'?'inbound':'outbound'} allow list</b><span>${esc(n.name)}</span></div>${pk}<table><thead><tr><th>Allowed traffic</th><th>${dirn==='inb'?'From':'To'}</th><th>Result</th></tr></thead><tbody>`;
    const st=!!s.ref.stateful;
    groups.forEach(g=>{
      h+=`<tr class="grp" style="animation-delay:${(j++)*.16}s"><td colspan="3">${esc(g.name)}</td></tr>`;
      if(!g[dirn].length)h+=`<tr class="miss" style="animation-delay:${(j++)*.16}s"><td colspan="3">No ${dirn==='inb'?'inbound':'outbound'} rules</td></tr>`;
      g[dirn].forEach(r=>{const m=!st&&match(r),win=m&&!won;if(win)won=true;h+=`<tr class="${win?'win':m?'cand':'miss'}" style="animation-delay:${(j++)*.16}s"><td>${esc(ruleTxt(r))}</td><td>${esc(peerTxt(r.peer))}</td><td>${win?'✓ allows it':m?'also matches':'no'}</td></tr>`;});
    });
    if(!groups.length)h+='<tr class="bad"><td colspan="3">No security group attached</td></tr>';
    h+='</tbody></table>';
    if(st)h=h.replace(/<\/tbody><\/table>$/,'<tr class="win"><td colspan="3">✓ Tracked connection: reply to an allowed request</td></tr></tbody></table>');
    note=st?'Security groups are stateful. This reply belongs to a connection that was already allowed, so no rule needs to match.':won?'A rule on the allow list matches, so the packet goes through. Security groups only contain allow rules.':'Nothing on the allow list matches, so the packet is dropped. Anything a security group doesn’t allow is denied.';
    el=groups.length?'sg:'+groups[0].id:'';

}
const isChk=s=>!!s&&!!s.ref&&['route','nacl','sg'].indexOf(s.kind)>=0;
function chkLabel(s){

const svg=$('#bsvg');
const absSn=s=>{const v=V(s.vpc);return{x:v.x+s.x,y:v.y+s.y,w:s.w,h:s.h};};
const absNode=n=>{const a=absSn(S(n.subnet));return{x:a.x+n.x,y:a.y+n.y};};
const chipW=t=>Math.max(42,18+String(t).length*6.3);
const IS=.85,isIso=()=>document.documentElement.classList.contains('iso'),isoM=()=>isIso()?`matrix(${IS},${IS/2},${-IS},${IS/2},0,0)`:'matrix(1,0,0,1,0,0)';
const P=p=>isIso()?{x:IS*(p.x-p.y),y:IS*(p.x+p.y)/2}:{x:p.x,y:p.y},PI=q=>isIso()?{x:(q.x/IS+2*q.y/IS)/2,y:(2*q.y/IS-q.x/IS)/2}:{x:q.x,y:q.y};

function pos(at){

  if(k==='gwe'){const e=D.gwes.find(x=>x.id===id),v=e&&V(e.vpc);if(!v)return null;return{x:v.x+v.w,y:v.y+84+D.gwes.filter(x=>x.vpc===v.id).indexOf(e)*92};}
  if(k==='vgw'){const g=D.vgws.find(x=>x.id===id),v=g&&V(g.vpc);return v?{x:v.x,y:v.y+v.h/2}:null;}

  if(k==='edge'){if(!D.cdn)return null;const o=EDGE[id]||[0,0];return{x:D.cdn.x+o[0],y:D.cdn.y+o[1]};}

function ask(o){
  const dlg=$('#b-dlg');dlg.className='';
  dlg.innerHTML=`<div class="in"><h2>${o.title}</h2>${o.intro?`<p class="mut">${o.intro}</p>`:''}${(o.fields||[]).map(field).join('')}<p class="err" id="b-err"></p><div class="acts"><button class="btn" data-b="dlg-x">${o.cancel||'Cancel'}</button><button class="btn primary" data-b="dlg-ok">${o.ok||'Create'}</button></div></div>`;
  dlg._o=o;
  if(!dlg.open){if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');}
  const first=dlg.querySelector('input[type="text"],textarea');if(first){first.focus();first.select&&first.select();}
}
function dlgOk(){
  const dlg=$('#b-dlg'),o=dlg._o,v={};
  $$('[data-kg]',dlg).forEach(e=>{v[e.dataset.kg]=[];});
  $$('[data-k]',dlg).forEach(e=>{v[e.dataset.k]=e.type==='checkbox'?e.checked:e.value.trim();});
  $$('input[type="radio"]:checked',dlg).forEach(e=>{v[e.name]=e.value;});
  $$('[data-ks]',dlg).forEach(e=>{if(e.checked)v[e.dataset.ks].push(e.value);});
  const err=o.done&&o.done(v);
  if(err){$('#b-err').textContent=err;return;}
  dlgClose();
}
function dlgClose(){const dlg=$('#b-dlg');if(dlg.close)dlg.close();else dlg.removeAttribute('open');}
$('#b-dlg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type==='text'){e.preventDefault();dlgOk();}});

/* ---------- placing parts ---------- */
const after=el=>{sel=el;tab='props';commit();};
const uniqName=(arr,base)=>{let n=base,i=2;while(arr.some(x=>x.name===n))n=base+'-'+(i++);return n;};
function freeVpcCidr(){for(let i=0;i<255;i++){const c='10.'+i+'.0.0/16';if(!D.vpcs.some(v=>E.overlap(v.cidr,c)))return c;}return '172.16.0.0/16';}
function freeSubnetCidr(v){
  const c=E.cidr(v.cidr),len=c.len<=24?24:28,step=Math.pow(2,32-len);
  for(let i=(c.len<24?1:0);i<c.size/step;i++){const k=E.n2ip(c.n+i*step)+'/'+len;if(!D.subnets.some(s=>s.vpc===v.id&&E.overlap(s.cidr,k)))return k;}
  return E.n2ip(c.n)+'/'+len;
}
const sgOptions=v=>D.sgs.filter(g=>g.vpc===v.id).map(g=>[g.id,g.name]).concat([['new:web','New: web access (HTTP and HTTPS from anywhere)'],['new:empty','New: nothing allowed in']]);
function pickSg(v,val,name,port){if(val==='new:db'){const g=mkSg(v,uniqName(D.sgs.filter(x=>x.vpc===v.id),name+'-sg'),'db');g.inb[0].ports=String(port);return g.id;}if(val==='new:web')return mkSg(v,uniqName(D.sgs.filter(g=>g.vpc===v.id),name+'-sg'),'web').id;if(val==='new:empty')return mkSg(v,uniqName(D.sgs.filter(g=>g.vpc===v.id),name+'-sg'),'empty').id;return val;}
function place(type,w){
  const sn=D.subnets.find(s=>inR(w,absSn(s)));
  let v=sn?V(sn.vpc):D.vpcs.find(x=>inR(w,x));
  const needV=()=>{if(!v&&D.vpcs.length===1)v=D.vpcs[0];if(!v){toast(D.vpcs.length?'Drop the '+PNAME[type].toLowerCase()+' inside a VPC.':'Create a VPC first, then drop this inside it.');return false;}return true;};
  const needS=()=>{if(!sn){toast(D.subnets.length?'Drop the '+PNAME[type].toLowerCase()+' inside a subnet.':'Create a subnet first, then drop this inside it.');return false;}return true;};
  const rel=sn?{x:Math.round(clampv(w.x-absSn(sn).x,34,sn.w-34)),y:Math.round(clampv(w.y-absSn(sn).y,88,sn.h-86))}:null;
  if(type==='vpc'){
    ask({title:'Create a VPC',intro:'A private, isolated network of your own. Nothing gets in or out until you add gateways and routes.',fields:[{k:'name',label:'Name',value:uniqName(D.vpcs,'my-vpc')},{k:'cidr',label:'Address range',value:freeVpcCidr(),mono:true,hint:'A CIDR block between /16 and /28. 10.0.0.0/16 gives you 65,536 private addresses.'}],
      done:o=>{const c=E.cidr(o.cidr);if(!o.name)return 'Give the VPC a name.';if(!c||c.len<16||c.len>28)return 'Use a CIDR block between /16 and /28, for example 10.0.0.0/16.';const nv=mkVpc({name:o.name,cidr:c.text,x:Math.round(w.x-300),y:Math.round(w.y-60)});after('vpc:'+nv.id);toast('VPC created with a default security group and a default network ACL. Add a subnet next.');}});
  }else if(type==='subnet'){
    if(!needV())return;
    const vv=v,cnt=D.subnets.filter(s=>s.vpc===vv.id).length,inside=inR(w,vv);
    const px=inside?Math.round(Math.max(10,w.x-vv.x-126)):16+(cnt%2)*268,py=inside?Math.round(Math.max(40,w.y-vv.y-40)):52+Math.floor(cnt/2)*238;
    ask({title:'Create a subnet in '+esc(vv.name),intro:'A slice of the VPC’s address range that lives in one Availability Zone. Servers launch into subnets.',fields:[
      {k:'kind',type:'radio',label:'Public or private?',value:'public',options:[['public','Public','Gets a route table that sends 0.0.0.0/0 to the internet gateway, and new servers get a public IP. For load balancers, NAT gateways and anything the internet must reach.'],['private','Private','Gets a route table with no route to the internet gateway. For app servers and databases that must never be reached from outside.']]},
      {k:'name',label:'Name',value:'',ph:'named after its kind if left empty'},
      {k:'az',type:'select',label:'Availability Zone',value:AZS[Math.floor(cnt/2)%3],options:AZS.map(a=>[a,a])},
      {k:'cidr',label:'Address range',value:freeSubnetCidr(vv),mono:true,hint:'Has to sit inside '+vv.cidr+' and not overlap another subnet.'},
      {k:'igw',type:'check',label:'If it’s public and the VPC has no internet gateway yet, attach one',value:true}],
      done:o=>{
        const c=E.cidr(o.cidr);
        if(!c||c.len>28||c.len<16)return 'Use a CIDR block between /16 and /28, for example 10.0.1.0/24.';
        if(!E.within(c.text,vv.cidr))return 'The range has to sit inside the VPC’s range, '+vv.cidr+'.';
        const clash=D.subnets.find(s=>s.vpc===vv.id&&E.overlap(s.cidr,c.text));
        if(clash)return 'That range overlaps subnet '+clash.name+' ('+clash.cidr+').';
        const s=mkSubnet({vpc:vv.id,name:o.name||uniqName(D.subnets.filter(x=>x.vpc===vv.id),o.kind+'-'+o.az.slice(-1)),kind:o.kind,az:o.az,cidr:c.text,x:px,y:py,igw:o.igw});
        after('subnet:'+s.id);
        toast(o.kind==='public'?(E.isPublic(D,s)?'Public subnet created. Its route table sends 0.0.0.0/0 to the internet gateway.':'Subnet created, but it isn’t public yet: the VPC has no internet gateway for its route table to point to.'):'Private subnet created. Its route table has only the built-in local route.');
      }});
  }else if(type==='rt'){
    if(!needV())return;const vv=v;
    ask({title:'Create a route table in '+esc(vv.name),intro:'It starts with only the built-in local route. Add routes, then associate subnets with it.',fields:[{k:'name',label:'Name',value:uniqName(D.rts.filter(r=>r.vpc===vv.id),'custom-rt')}],done:o=>{if(!o.name)return 'Give it a name.';after('rt:'+mkRt(vv,o.name).id);}});
  }else if(type==='igw'){
    if(!needV())return;
    if(D.igws.some(g=>g.vpc===v.id)){toast(v.name+' already has an internet gateway. A VPC can have only one.');return;}
    const g=mkIgw(v);after('igw:'+g.id);toast('Internet gateway attached. A subnet only becomes public when its route table points 0.0.0.0/0 at it.');
  }else if(type==='nat'){
    if(!needS())return;
    const n=mkNode(Object.assign({type:'nat',subnet:sn.id,name:uniqName(D.nodes,'nat-'+sn.az.slice(-1)),pub:true},rel));
    if(!n){toast('That subnet has no free addresses left.');return;}
    after('node:'+n.id);
    toast(E.isPublic(D,sn)?'NAT gateway created with an Elastic IP. Now point a private route table’s 0.0.0.0/0 at it.':'NAT gateway created, but this subnet isn’t public, so it can’t reach the internet from here.');
  }else if(type==='ec2'){
    if(!needS())return;const vv=v,ss=sn;
    ask({title:'Launch a server in '+esc(ss.name),fields:[{k:'name',label:'Name',value:uniqName(D.nodes,'server')},{k:'sg',type:'select',label:'Security group',value:D.sgs.find(g=>g.vpc===vv.id&&g.def).id,options:sgOptions(vv),hint:'The firewall on the server itself. The default group only lets in traffic from other members of the same group.'},{k:'pub',type:'check',label:'Give it a public IP',value:ss.autoPub}],ok:'Launch',
      done:o=>{if(!o.name)return 'Give the server a name.';const n=mkNode(Object.assign({type:'ec2',subnet:ss.id,name:o.name,pub:o.pub,sgs:[pickSg(vv,o.sg,o.name)]},rel));if(!n)return 'That subnet has no free addresses left.';after('node:'+n.id);}});
  }else if(type==='alb'){
    if(!needS())return;const vv=v,ss=sn;
    const tg=D.nodes.filter(n=>(n.type==='ec2'||n.type==='eks')&&S(n.subnet).vpc===vv.id).map(n=>[n.id,n.name+' ('+n.ip+')']);
    ask({title:'Create a load balancer in '+esc(ss.name),intro:'Accepts connections on one port and opens new ones to a target server. A real load balancer spans at least two Availability Zones; here it sits in one subnet to keep the picture simple.',fields:[
      {k:'name',label:'Name',value:uniqName(D.nodes,'web-lb')},
      {k:'scheme',type:'radio',label:'Who can reach it?',value:'internet',options:[['internet','Internet-facing','Gets a public address. Belongs in a public subnet.'],['internal','Internal','Private address only, for traffic from inside your networks.']]},
      {k:'port',label:'Listens on port',value:'443',mono:true},
      {k:'target',type:'select',label:'Sends to',value:tg.length?tg[0][0]:'',options:[['','Choose later']].concat(tg)},
      {k:'tport',label:'Target port',value:'8080',mono:true},
      {k:'sg',type:'select',label:'Security group',value:'new:web',options:sgOptions(vv)}],
      done:o=>{const p=+o.port,tp=+o.tport;if(!o.name)return 'Give it a name.';if(!(p>=1&&p<=65535)||!(tp>=1&&tp<=65535))return 'A port is a number from 1 to 65535.';const n=mkNode(Object.assign({type:'alb',subnet:ss.id,name:o.name,pub:o.scheme==='internet',sgs:[pickSg(vv,o.sg,o.name)],scheme:o.scheme,port:p,target:o.target,tport:tp},rel));if(!n)return 'That subnet has no free addresses left.';after('node:'+n.id);}});
  }else if(type==='eks'||type==='lambda'){
    if(!needS())return;const vv=v,ss=sn,k=type==='eks';
    ask({title:k?'Add an EKS service to '+esc(ss.name):'Attach a Lambda function to '+esc(ss.name),
      intro:k?'A group of pods on Amazon EKS, such as one microservice. With the VPC CNI every pod gets a private address from this subnet, so routes, network ACLs and security groups apply to it like to a server. Put a load balancer in front of anything the outside should reach.':'A VPC-attached function gets a network interface with a private address in this subnet, so it can reach databases and other private resources. It never gets a public IP: to reach the internet or AWS services it needs a NAT gateway or VPC endpoints.',
      fields:[{k:'name',label:'Name',value:uniqName(D.nodes,k?'orders-svc':'worker-fn')},{k:'sg',type:'select',label:'Security group',value:k?D.sgs.find(g=>g.vpc===vv.id&&g.def).id:'new:empty',options:sgOptions(vv)}],ok:k?'Add':'Attach',
      done:o=>{if(!o.name)return 'Give it a name.';const n=mkNode(Object.assign({type,subnet:ss.id,name:o.name,sgs:[pickSg(vv,o.sg,o.name)]},rel));if(!n)return 'That subnet has no free addresses left.';after('node:'+n.id);}});
  }else if(type==='redis'){
    if(!needS())return;const vv=v,ss=sn;
    ask({title:'Create a Redis cache in '+esc(ss.name),intro:'An ElastiCache cluster lives inside your VPC with private addresses only. Applications connect to it on port 6379, and its security group decides which of them may.',fields:[{k:'name',label:'Name',value:uniqName(D.nodes,'app-cache')},{k:'sg',type:'select',label:'Security group',value:'new:db',options:[['new:db','New: cache port from inside the VPC']].concat(sgOptions(vv))}],
      done:o=>{if(!o.name)return 'Give the cache a name.';const n=mkNode(Object.assign({type:'redis',subnet:ss.id,name:o.name,sgs:[pickSg(vv,o.sg,o.name,6379)]},rel));if(!n)return 'That subnet has no free addresses left.';after('node:'+n.id);}});
  }else if(type==='cdn'){
    if(D.cdn){toast('The design already has a CloudFront edge. Click it to change its settings.');return;}
    ask({title:'Add a CloudFront edge',intro:'The usual front of a web application, and none of it lives in a VPC: Route 53 for the name, WAF to filter requests, a certificate from Certificate Manager, and CloudFront to serve static pages from a private bucket and pass API calls on to API Gateway.',fields:[{k:'name',label:'Domain name',value:'app.example.com',mono:true}],ok:'Add',
      done:o=>{if(!o.name)return 'Give it a domain name.';D.cdn={x:Math.round(w.x),y:Math.round(w.y),name:o.name,dns:true,cert:true,waf:true,block:''};after('edge:cdn');}});
  }else if(type==='ext'){
    ask({title:'Add an external service',intro:'A third party that your application calls over the internet, such as a push-notification or payment provider. Private subnets reach it through a NAT gateway.',fields:[{k:'name',label:'Name',value:uniqName(D.exts,'partner-api')},{k:'ip',label:'Public address',value:'198.51.100.'+(90+D.exts.length),mono:true}],ok:'Add',
      done:o=>{if(!o.name)return 'Give it a name.';if(E.ip2n(o.ip)===null||E.isPrivate(o.ip))return 'An external service needs a public IPv4 address.';const x={id:nid('ext'),name:o.name,ip:o.ip,x:Math.round(w.x),y:Math.round(w.y)};D.exts.push(x);after('ext:'+x.id);}});
  }else if(type==='rds'){
    if(!needS())return;const vv=v,ss=sn;
    ask({title:'Create a database in '+esc(ss.name),intro:'An RDS database lives inside your VPC, in a subnet, with a private address and a security group like a server. A real one needs subnets in two Availability Zones; here it sits in one to keep the picture simple.',fields:[
      {k:'name',label:'Name',value:uniqName(D.nodes,'app-db')},
      {k:'engine',type:'select',label:'Engine',value:'mysql',options:[['mysql','MySQL (port 3306)'],['postgres','PostgreSQL (port 5432)']]},
      {k:'sg',type:'select',label:'Security group',value:'new:db',options:[['new:db','New: database port from inside the VPC']].concat(sgOptions(vv)),hint:'Tighten it afterwards so only your app servers’ security group is allowed in.'},
      {k:'pub',type:'check',label:'Publicly accessible (gets a public address; rarely a good idea)',value:false}],
      done:o=>{if(!o.name)return 'Give the database a name.';const port=o.engine==='postgres'?5432:3306;const n=mkNode(Object.assign({type:'rds',subnet:ss.id,name:o.name,pub:o.pub,engine:o.engine,port,sgs:[pickSg(vv,o.sg,o.name,port)]},rel));if(!n)return 'That subnet has no free addresses left.';after('node:'+n.id);toast('Database created at '+n.ip+', listening on port '+port+'.');}});
  }else if(type==='api'){
    if(D.api){toast('The design already has an API Gateway. Click it to change its settings.');return;}
    const lbs=D.nodes.filter(n=>n.type==='alb'||n.type==='lambda').map(n=>[n.id,n.name+(n.type==='lambda'?' (Lambda function)':' in '+V(S(n.subnet).vpc).name)]);
    ask({title:'Create an API Gateway',intro:'A managed front door for your APIs. Like S3, it lives outside your VPCs. To reach servers in private subnets it uses a private integration: a VPC link places a network interface in your subnet, and from there it calls a load balancer.',fields:[
      {k:'name',label:'Name',value:'orders-api'},
      {k:'type',type:'radio',label:'Who can call it?',value:'regional',options:[['regional','Public','Anyone on the internet can reach it over HTTPS.'],['private','Private','Only reachable from inside a VPC that has an interface endpoint for API Gateway.']]},
      {k:'target',type:'select',label:'Sends requests to',value:lbs.length?lbs[0][0]:'',options:[['','Nothing in a VPC: it answers by itself']].concat(lbs),hint:lbs.length?'For a load balancer, a VPC link is created beside it. A Lambda function is invoked directly and needs none.':'Add a load balancer or a Lambda function first if the API should call something of yours.'},
      {k:'allow',type:'check',label:'Let the VPC link in through the load balancer’s security group',value:true}],
      done:o=>{if(!o.name)return 'Give the API a name.';D.api={x:Math.round(w.x),y:Math.round(w.y),name:o.name,type:o.type,target:o.target,link:''};const g=apiLink();if(o.allow)allowLink(g);after('svc:apigw');toast(D.api.link?'API Gateway created with a VPC link next to its load balancer.':o.target?'API Gateway created. It invokes the function through the Lambda service, with no VPC link.':'API Gateway created. Pick a load balancer in its properties to give it a private integration.');}});
  }else if(type==='sg'){
    if(!needV())return;const vv=v;
    ask({title:'Create a security group in '+esc(vv.name),intro:'A firewall attached to individual servers. It only has allow rules, and it remembers connections, so replies are let through automatically.',fields:[{k:'name',label:'Name',value:uniqName(D.sgs.filter(g=>g.vpc===vv.id),'my-sg')},{k:'kind',type:'select',label:'Start with',value:'empty',options:[['empty','Nothing allowed in'],['web','Web: HTTP and HTTPS from anywhere'],['ssh','SSH from one address'],['app','App: port 8080 from inside the VPC'],['db','Database: port 3306 from inside the VPC']]}],
      done:o=>{if(!o.name)return 'Give it a name.';after('sg:'+mkSg(vv,o.name,o.kind).id);toast('Security group created. Attach it to a server from the server’s properties.');}});
  }else if(type==='nacl'){
    if(!needV())return;const vv=v;
    ask({title:'Create a network ACL in '+esc(vv.name),intro:'A firewall at the edge of a subnet. Rules are numbered and checked in order, can allow or deny, and replies need their own rule.',fields:[{k:'name',label:'Name',value:uniqName(D.nacls.filter(a=>a.vpc===vv.id),'custom-acl')},{k:'start',type:'radio',label:'Starting rules',value:'open',options:[['open','Allow everything','Add deny rules in front to block specific addresses.'],['closed','Deny everything','How a new custom ACL behaves in AWS. Nothing passes until you add allow rules.']]}],
      done:o=>{if(!o.name)return 'Give it a name.';const a={id:nid('acl'),vpc:vv.id,name:o.name,def:false,rules:o.start==='open'?openRules():[]};D.nacls.push(a);after('nacl:'+a.id);toast('Network ACL created. Associate a subnet with it from the subnet’s properties.');}});
  }else if(type==='gwe'){
    if(!needV())return;const vv=v;
    const free=['s3','dynamodb'].filter(s=>!D.gwes.some(e=>e.vpc===vv.id&&e.service===s));
    if(!free.length){toast(vv.name+' already has gateway endpoints for S3 and DynamoDB.');return;}
    const rts=D.rts.filter(r=>r.vpc===vv.id);
    ask({title:'Create a gateway endpoint in '+esc(vv.name),intro:'Adds a route for the service’s address ranges, so traffic to it stays on the AWS private network. Free of charge.',fields:[{k:'svc',type:'select',label:'Service',value:free[0],options:free.map(s=>[s,E.SVC[s].name])},{k:'rts',type:'checks',label:'Add the route to these route tables',value:rts.map(r=>r.id),options:rts.map(r=>[r.id,r.name])}],
      done:o=>{after('gwe:'+mkGwe(vv,o.svc,o.rts).id);}});
  }else if(type==='vpce'){
    if(!needS())return;const vv=v,ss=sn;
    ask({title:'Create an interface endpoint in '+esc(ss.name),intro:'Puts a network interface with a private IP into the subnet. The service’s name then resolves to that address inside this VPC. Billed by the hour and by the gigabyte.',fields:[{k:'svc',type:'select',label:'Service',value:'sqs',options:Object.values(E.SVC).map(s=>[s.id,s.name])},{k:'sg',type:'select',label:'Security group',value:D.sgs.find(g=>g.vpc===vv.id&&g.def).id,options:sgOptions(vv),hint:'Has to allow HTTPS (port 443) from the servers that will use the endpoint.'}],
      done:o=>{const n=mkNode(Object.assign({type:'vpce',subnet:ss.id,name:o.svc+'-endpoint',service:o.svc,sgs:[pickSg(vv,o.sg,o.svc+'-endpoint')]},rel));if(!n)return 'That subnet has no free addresses left.';after('node:'+n.id);}});
  }else if(type==='pcx'){
    if(!needV())return;const vv=v,others=D.vpcs.filter(x=>x.id!==vv.id);
    if(!others.length){toast('Peering joins two VPCs. Create a second VPC first.');return;}
    ask({title:'Peer '+esc(vv.name)+' with another VPC',intro:'A private link between exactly two VPCs. Both sides need a route to the other’s range, and traffic never passes through to a third network.',fields:[{k:'peer',type:'select',label:'Peer with',value:others[0].id,options:others.map(x=>[x.id,x.name+' ('+x.cidr+')'])},{k:'routes',type:'check',label:'Add routes for the peer’s range to every route table on both sides',value:true}],
      done:o=>{const b=V(o.peer);if(D.pcxs.some(x=>(x.a===vv.id&&x.b===b.id)||(x.a===b.id&&x.b===vv.id)))return 'These two VPCs are already peered.';if(E.overlap(vv.cidr,b.cidr))return 'Their address ranges overlap ('+vv.cidr+' and '+b.cidr+'). AWS refuses to peer VPCs that overlap.';after('pcx:'+mkPcx(vv.id,b.id,o.routes).id);}});
  }else if(type==='tgw'){
    ask({title:'Create a transit gateway',intro:'A regional router. Every VPC and VPN you attach can reach every other attachment through it, which scales better than peering each pair.',fields:[{k:'name',label:'Name',value:uniqName(D.tgws,'hub')},{k:'atts',type:'checks',label:'Attach these VPCs',value:D.vpcs.map(x=>x.id),options:D.vpcs.map(x=>[x.id,x.name+' ('+x.cidr+')'])},{k:'routes',type:'check',label:'Add routes to the attached VPCs’ route tables',value:true}],
      done:o=>{if(!o.name)return 'Give it a name.';after('tgw:'+mkTgw({name:o.name,x:Math.round(w.x),y:Math.round(w.y),atts:o.atts,routes:o.routes}).id);}});
  }else if(type==='onprem'){
    if(D.onprem){toast('The design already has an office network.');return;}
    mkOnprem(Math.round(w.x-95),Math.round(w.y-70));after('onprem');toast('Office network added. Drop a VPN connection on a VPC or a transit gateway to link it.');
  }else if(type==='vpn'){
    const tg=D.tgws.find(t=>Math.hypot(t.x-w.x,t.y-w.y)<46);
    if(!tg&&!v&&D.vpcs.length===1&&!D.tgws.length)v=D.vpcs[0];
    if(!tg&&!v){toast('Drop the VPN connection on a VPC or on a transit gateway.');return;}
    if(tg){mkVpn(null,tg);after('tgw:'+tg.id);toast('VPN attached to the transit gateway. Routes to the office range were added to the attached VPCs.');}
    else{const g=mkVpn(v,null);after('vgw:'+g.id);toast('VPN created on a virtual private gateway. Routes to the office range were added to this VPC’s route tables.');}
  }
}

/* ---------- property panels ---------- */
const F=(label,html)=>`<label class="f"><span>${label}</span>${html}</label>`;
const da=o=>Object.keys(o||{}).map(k=>` data-${k}="${esc(o[k])}"`).join('');
const inp=(ch,val,d,x)=>`<input type="text" data-ch="${ch}"${da(d)} value="${esc(val)}" ${x||''}>`;
const sl=(ch,val,opts,d)=>`<select data-ch="${ch}"${da(d)}>${opts.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(val)?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;

const delB=(t,id,label)=>{const why=canDel(t,id);return `<button class="btn danger" data-b="del" data-t="${t}" data-id="${id}"${why?' disabled':''}>${label}</button>${why?`<p class="mut sm">${why}</p>`:''}`;};
const PROTOS=[['tcp','TCP'],['udp','UDP'],['icmp','ICMP'],['all','All']];
function sgChecks(n,v){return D.sgs.filter(g=>g.vpc===v.id).map(g=>`<div class="row" style="margin:2px 0">${ck('node-sg',n.sgs.indexOf(g.id)>=0,esc(g.name),{id:n.id,sg:g.id})}<span class="grow"></span>${go('sg:'+g.id,'Edit rules')}</div>`).join('');}
const START='<h3>Getting started</h3><ol class="b-start"><li>Drag a VPC onto the canvas and choose its address range.</li><li>Drop subnets inside it. Each one asks whether it’s public or private.</li><li>Add an internet gateway, and a NAT gateway or endpoints for the private side.</li><li>Drop servers, databases and other parts into the subnets.</li><li>Open the Test tab and send a packet through what you built.</li></ol>';
function pOverview(){

  <h3>Design review</h3>${f.length?'<ul class="b-find">'+f.map(x=>`<li>${esc(x.text)} ${go(x.el,'Show')}</li>`).join('')+'</ul>':`<p class="mut">${D.vpcs.length?'Nothing looks wrong.':'Nothing to review yet.'}</p>`}
  <h3>What’s in it</h3>${lks(D.vpcs.map(v=>go('vpc:'+v.id,v.name)+` <span class="mut">${v.cidr}, ${D.subnets.filter(s=>s.vpc===v.id).length} subnets</span>`))}
  <div class="b-note">Addresses on the canvas are examples. Security groups, network ACLs and route tables behave as they do in AWS: the most specific route wins, ACL rules run in number order, and only security groups remember connections.</div>`;
}
function pVpc(id){
  const v=V(id);if(!v)return '';const g=D.igws.find(x=>x.vpc===id);
  return `<h2>VPC</h2><p class="mut">An isolated network. Everything inside can reach everything else through the built-in local route.</p>`+
    F('Name',inp('name',v.name,{t:'vpc',id}))+F('Address range',inp('vpc-cidr',v.cidr,{id},'class="mono"'))+
    `<h3>Internet gateway</h3>${g?lks([go('igw:'+g.id,'Attached')]):'<p class="mut">None. Drop one in to give the VPC a door to the internet.</p>'}

    <h3>Route tables</h3>${lks(D.rts.filter(r=>r.vpc===id).map(r=>go('rt:'+r.id,r.name)+` <span class="mut">${r.routes.length+1} routes</span>`))}
    <h3>Security groups</h3>${lks(D.sgs.filter(x=>x.vpc===id).map(x=>go('sg:'+x.id,x.name)))}
    <h3>Network ACLs</h3>${lks(D.nacls.filter(x=>x.vpc===id).map(x=>go('nacl:'+x.id,x.name)))}`+delB('vpc',id,'Delete this VPC and everything in it');

function pSubnet(id){

  return `<h2>Subnet</h2><p class="mut">${pub?'Public: route table '+esc(rt.name)+' has a route to the internet gateway.':'Private: route table '+esc(rt?rt.name:'none')+' has no route to an internet gateway.'} That route is the only thing that makes a subnet public or private.</p>`+
    F('Name',inp('name',s.name,{t:'subnet',id}))+F('Address range',inp('sn-cidr',s.cidr,{id},'class="mono"'))+F('Availability Zone',sl('sn-az',s.az,AZS.map(a=>[a,a]),{id}))+
    F('Route table',sl('sn-rt',s.rt,D.rts.filter(r=>r.vpc===s.vpc).map(r=>[r.id,r.name]),{id}))+`<p class="hint">${go('rt:'+s.rt,'Edit its routes')}</p>`+
    F('Network ACL',sl('sn-nacl',s.nacl,D.nacls.filter(a=>a.vpc===s.vpc).map(a=>[a.id,a.name]),{id}))+`<p class="hint">${go('nacl:'+s.nacl,'Edit its rules')}</p>`+
    ck('sn-auto',s.autoPub,'New servers here get a public IP',{id})+
    `<h3>In this subnet</h3>${lks(D.nodes.filter(n=>n.subnet===id).map(n=>go('node:'+n.id,n.name)+` <span class="mut">${n.ip}</span>`))}`+delB('subnet',id,'Delete this subnet');
}
function pNode(id){
  const n=N(id);if(!n)return '';const s=S(n.subnet),v=V(s.vpc);
  if(n.type==='nat'){
    const users=D.rts.filter(r=>r.routes.some(x=>x.target===id));
    return `<h2>NAT gateway</h2><p class="mut">Lets servers in private subnets start connections to the internet, and brings the replies back. Nothing outside can start a connection through it.</p>`+
      F('Name',inp('name',n.name,{t:'node',id}))+F('Private address',`<span class="mono">${n.ip}</span>`)+F('Elastic IP',`<span class="mono">${n.pub}</span>`)+
      `<div class="b-note">${E.isPublic(D,s)?'It sits in a public subnet, as it must.':'Its subnet has no route to an internet gateway, so it can’t reach the internet. Move the route or recreate it in a public subnet.'}</div>
      <h3>Route tables that send traffic here</h3>${users.length?lks(users.map(r=>go('rt:'+r.id,r.name))):'<p class="mut">None yet. Open a private route table and point 0.0.0.0/0 at this NAT gateway.</p>'}`+delB('node',id,'Delete this NAT gateway');
  }
  if(n.type==='alb'){
    const tg=D.nodes.filter(x=>(x.type==='ec2'||x.type==='eks')&&S(x.subnet).vpc===v.id).map(x=>[x.id,x.name+' ('+x.ip+')']);
    return `<h2>Load balancer</h2><p class="mut">Accepts a connection, then opens a new one from its own private address to the target. The target’s security group has to allow the load balancer, not the original client.</p>`+
      F('Name',inp('name',n.name,{t:'node',id}))+F('Reachable from',sl('node-f',n.scheme,[['internet','The internet'],['internal','Inside only']],{id,f:'scheme'}))+
      F('Listens on port',inp('node-f',n.port,{id,f:'port'},'class="mono"'))+F('Sends to',sl('node-f',n.target,[['','Choose a target']].concat(tg),{id,f:'target'}))+F('Target port',inp('node-f',n.tport,{id,f:'tport'},'class="mono"'))+
      F('Private address',`<span class="mono">${n.ip}</span>`)+(n.pub?F('Public address',`<span class="mono">${n.pub}</span>`):'')+
      `<h3>Security groups</h3>${sgChecks(n,v)}<div class="row"><button class="btn" data-b="test-to" data-el="node:${id}">Test a connection to it</button></div>`+delB('node',id,'Delete this load balancer');
  }
  if(n.type==='vpce'){
    return `<h2>Interface endpoint</h2><p class="mut">A network interface with a private address that leads to ${esc(E.SVC[n.service].name)} over PrivateLink. Inside this VPC, the service’s name resolves to this address.</p>`+
      F('Service',sl('node-f',n.service,Object.values(E.SVC).map(x=>[x.id,x.name]),{id,f:'service'}))+F('Private address',`<span class="mono">${n.ip}</span>`)+
      `<h3>Security groups</h3>${sgChecks(n,v)}<p class="mut sm">Has to allow HTTPS, port 443, from the servers that use it.</p>`+delB('node',id,'Delete this endpoint');
  }
  if(n.type==='redis'){
    return `<h2>Cache (ElastiCache Redis)</h2><p class="mut">An in-memory cache inside subnet ${esc(s.name)}. Like RDS it lives in your VPC with a private address only, and its security group decides who may connect.</p>`+
      F('Name',inp('name',n.name,{t:'node',id}))+F('Port',inp('node-f',n.port,{id,f:'port'},'class="mono"'))+F('Private address',`<span class="mono">${n.ip}</span>`)+
      `<h3>Security groups</h3>${sgChecks(n,v)}<div class="row"><button class="btn" data-b="test-to" data-el="node:${id}">Test a connection to it</button></div>`+delB('node',id,'Delete this cache');
  }
  if(n.type==='rds'){
    return `<h2>Database (RDS)</h2><p class="mut">A managed database inside subnet ${esc(s.name)}. Unlike S3 or DynamoDB it lives in your VPC, so it’s reached through the local route and guarded by its security group.</p>`+
      F('Name',inp('name',n.name,{t:'node',id}))+F('Engine',sl('node-f',n.engine,[['mysql','MySQL'],['postgres','PostgreSQL']],{id,f:'engine'}))+F('Port',inp('node-f',n.port,{id,f:'port'},'class="mono"'))+
      F('Private address',`<span class="mono">${n.ip}</span>`)+ck('node-pub',!!n.pub,'Publicly accessible'+(n.pub?': <span class="mono">'+n.pub+'</span>':''),{id})+
      `<h3>Security groups</h3>${sgChecks(n,v)}<div class="row"><button class="btn" data-b="test-to" data-el="node:${id}">Test a connection to it</button></div>`+delB('node',id,'Delete this database');
  }
  if(n.type==='vlink'){
    return `<h2>VPC link</h2><p class="mut">The network interface that API Gateway uses to step into ${esc(v.name)}. Requests to the load balancer come from this private address, so the load balancer’s security group has to allow this one.</p>`+
      F('Private address',`<span class="mono">${n.ip}</span>`)+`<h3>Security groups</h3>${sgChecks(n,v)}<h3>Used by</h3>${lks([go('svc:apigw',D.api?D.api.name:'API Gateway')])}<p class="mut sm">It follows the API’s target. To remove it, change the target in the API Gateway’s properties.</p>`;
  }
  const kind=n.type==='eks'?['EKS service','A group of pods on Amazon EKS in subnet '+esc(s.name)+'. With the VPC CNI each pod gets a private address from the subnet, so route tables, network ACLs and security groups apply to it just as they do to a server. AWS runs the cluster’s control plane. Expose a service through a load balancer, never directly.']:n.type==='lambda'?['Lambda function','A function attached to subnet '+esc(s.name)+'. It reaches private resources through this network interface. It never gets a public IP, so even in a public subnet it needs a NAT gateway or VPC endpoints to reach anything outside the VPC.']:['Server','An EC2 instance in subnet '+esc(s.name)+'. It only knows its private address; the internet gateway translates to and from the public one.'];
  return `<h2>${kind[0]}</h2><p class="mut">${kind[1]}</p>`+
    F('Name',inp('name',n.name,{t:'node',id}))+F('Private address',`<span class="mono">${n.ip}</span>`)+
    (n.type==='ec2'?ck('node-pub',!!n.pub,'Public IP'+(n.pub?': <span class="mono">'+n.pub+'</span>':''),{id}):'')+
    ck('node-role',n.role!==false,'IAM role that allows calls to AWS services',{id})+
    `<p class="mut sm">Drag it into another subnet and its address updates to match.</p><h3>Security groups</h3>${sgChecks(n,v)}
    <div class="row"><button class="btn" data-b="test-from" data-el="node:${id}">Test from here</button>${n.type==='lambda'?'':`<button class="btn" data-b="test-to" data-el="node:${id}">Test to here</button>`}</div>`+delB('node',id,'Delete this '+kind[0].toLowerCase());
}
function targetsFor(v,cur){
  const o=[['','Choose a target']];
  D.igws.filter(g=>g.vpc===v.id).forEach(g=>o.push([g.id,'Internet gateway']));
  D.nodes.filter(n=>n.type==='nat'&&S(n.subnet).vpc===v.id).forEach(n=>o.push([n.id,'NAT gateway '+n.name]));
  D.gwes.filter(e=>e.vpc===v.id).forEach(e=>o.push([e.id,'Gateway endpoint, '+E.SVC[e.service].name]));
  D.pcxs.filter(x=>x.a===v.id||x.b===v.id).forEach(x=>{const p=V(x.a===v.id?x.b:x.a);o.push([x.id,'Peering to '+(p?p.name:'?')]);});
  D.tgws.filter(t=>t.atts.indexOf(v.id)>=0).forEach(t=>o.push([t.id,'Transit gateway '+t.name]));
  D.vgws.filter(g=>g.vpc===v.id).forEach(g=>o.push([g.id,'VPN gateway']));
  if(cur&&!o.some(x=>x[0]===cur))o.push([cur,cur+' (gone: blackhole)']);
  return o;
}
function pRt(id){
  const rt=RT(id);if(!rt)return '';const v=V(rt.vpc),users=D.subnets.filter(s=>s.rt===id);
  const dests=['0.0.0.0/0'].concat(D.vpcs.filter(x=>x.id!==v.id).map(x=>x.cidr),D.onprem?[D.onprem.cidr]:[],['pl-s3','pl-dynamodb']);
  return `<h2>Route table</h2><p class="mut">When a packet leaves a subnet, the VPC router picks the most specific route here that matches the destination. No match means the packet is dropped.</p>`+
    F('Name',inp('name',rt.name,{t:'rt',id}))+
    `<h3>Routes</h3><div class="b-sign"><div><table class="b-t"><thead><tr><th style="width:42%">Destination</th><th>Target</th><th style="width:30px"></th></tr></thead><tbody>
    <tr><td class="fix mono">${v.cidr}</td><td class="fix">local</td><td></td></tr>`+
    rt.routes.map((r,i)=>`<tr class="${r.target&&!E.targetExists(D,rt,r.target)?'bad':''}"><td>${inp('rt-dest',r.dest,{id,i},'class="mono" list="b-dests" placeholder="0.0.0.0/0"')}</td><td>${sl('rt-target',r.target,targetsFor(v,r.target),{id,i})}</td><td><button class="x" data-b="rt-del" data-id="${id}" data-i="${i}" aria-label="Remove this route">×</button></td></tr>`).join('')+
    `</tbody></table></div></div><datalist id="b-dests">${dests.map(d=>`<option value="${d}"></option>`).join('')}</datalist>
    <button class="b-add" data-b="rt-add" data-id="${id}">Add a route</button>
    <p class="mut sm" style="margin-top:8px">A destination is a CIDR block, or a prefix list: pl-s3 and pl-dynamodb stand for those services’ address ranges.</p>
    <h3>Subnets that use it</h3>${users.length?lks(users.map(s=>go('subnet:'+s.id,s.name))):'<p class="mut">None. Pick this route table in a subnet’s properties.</p>'}`+delB('rt',id,'Delete this route table');
}
function pSg(id){
  const g=SG(id);if(!g)return '';const v=V(g.vpc),users=D.nodes.filter(n=>(n.sgs||[]).indexOf(id)>=0);
  const rows=dn=>g[dn].map((r,i)=>`<tr><td>${sl('sg-f',r.proto,PROTOS,{id,d:dn,i,f:'proto'})}</td><td>${inp('sg-f',r.ports,{id,d:dn,i,f:'ports'},'class="mono" placeholder="all"')}</td><td>${inp('sg-f',r.peer,{id,d:dn,i,f:'peer'},'class="mono" list="b-peers"')}</td><td><button class="x" data-b="sg-del" data-id="${id}" data-d="${dn}" data-i="${i}" aria-label="Remove this rule">×</button></td></tr>`).join('');
  const tbl=(dn,who)=>`<table class="b-t"><thead><tr><th style="width:66px">Protocol</th><th style="width:74px">Ports</th><th>${who}</th><th style="width:30px"></th></tr></thead><tbody>${rows(dn)||'<tr><td colspan="4" class="fix mut">No rules, so nothing is allowed.</td></tr>'}</tbody></table>`;
  return `<h2>Security group</h2><p class="mut">A firewall on each server it’s attached to. It only has allow rules, and it remembers connections: if a request is allowed, its reply is too.</p>`+
    F('Name',inp('name',g.name,{t:'sg',id}))+F('ID',`<span class="mono">${g.id}</span>`)+
    `<h3>Inbound rules</h3>${tbl('inb','Source')}
    <button class="b-add" data-b="sg-add" data-id="${id}" data-d="inb" data-p="443">HTTPS</button><button class="b-add" data-b="sg-add" data-id="${id}" data-d="inb" data-p="80">HTTP</button><button class="b-add" data-b="sg-add" data-id="${id}" data-d="inb" data-p="22">SSH</button><button class="b-add" data-b="sg-add" data-id="${id}" data-d="inb" data-p="">Custom rule</button>
    <h3>Outbound rules</h3>${tbl('out','Destination')}<button class="b-add" data-b="sg-add" data-id="${id}" data-d="out" data-p="">Add a rule</button>
    <datalist id="b-peers"><option value="0.0.0.0/0">Anywhere</option><option value="${v.cidr}">This VPC</option>${D.sgs.filter(x=>x.vpc===v.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</datalist>
    <p class="mut sm" style="margin-top:8px">A source can be a CIDR block, a single address, or another security group’s ID, which means “any server in that group”.</p>
    <h3>Attached to</h3>${users.length?lks(users.map(n=>go('node:'+n.id,n.name))):'<p class="mut">Nothing yet.</p>'}`+delB('sg',id,'Delete this security group');
}
function pNacl(id){
  const a=ACL(id);if(!a)return '';const users=D.subnets.filter(s=>s.nacl===id);
  const rows=dn=>a.rules.map((r,i)=>[r,i]).filter(x=>x[0].dir===dn).sort((x,y)=>x[0].n-y[0].n).map(x=>{const r=x[0],i=x[1];return `<tr><td>${inp('acl-f',r.n,{id,i,f:'n'},'class="mono"')}</td><td>${sl('acl-f',r.action,[['allow','Allow'],['deny','Deny']],{id,i,f:'action'})}</td><td>${sl('acl-f',r.proto,PROTOS,{id,i,f:'proto'})}</td><td>${inp('acl-f',r.ports,{id,i,f:'ports'},'class="mono" placeholder="all"')}</td><td>${inp('acl-f',r.cidr,{id,i,f:'cidr'},'class="mono"')}</td><td><button class="x" data-b="acl-del" data-id="${id}" data-i="${i}" aria-label="Remove this rule">×</button></td></tr>`;}).join('');
  const tbl=(dn,who)=>`<table class="b-t"><thead><tr><th style="width:42px">Rule</th><th style="width:66px">Action</th><th style="width:60px">Protocol</th><th style="width:50px">Ports</th><th>${who}</th><th style="width:30px"></th></tr></thead><tbody>${rows(dn)}<tr><td class="fix mono">*</td><td class="fix" colspan="5">Deny everything else</td></tr></tbody></table>`;
  return `<h2>Network ACL</h2><p class="mut">A firewall at the edge of a subnet. Rules are checked in number order and the first match decides. It doesn’t remember connections, so a reply needs its own rule, usually for ports 1024-65535.</p>`+
    F('Name',inp('name',a.name,{t:'nacl',id}))+
    `<h3>Block an address</h3><div class="row" style="margin-top:0"><input type="text" id="b-block" class="mono" placeholder="198.51.100.7" style="flex:1"><button class="btn" data-b="acl-block" data-id="${id}">Block</button></div>
    <h3>Inbound rules</h3>${tbl('in','Source')}<button class="b-add" data-b="acl-add" data-id="${id}" data-d="in">Add a rule</button>
    <h3>Outbound rules</h3>${tbl('out','Destination')}<button class="b-add" data-b="acl-add" data-id="${id}" data-d="out">Add a rule</button>
    <h3>Subnets that use it</h3>${users.length?lks(users.map(s=>go('subnet:'+s.id,s.name))):'<p class="mut">None. Pick this network ACL in a subnet’s properties.</p>'}`+delB('nacl',id,'Delete this network ACL');
}
function pIgw(id){
  const g=D.igws.find(x=>x.id===id);if(!g)return '';const users=D.rts.filter(r=>r.routes.some(x=>x.target===id));
  return `<h2>Internet gateway</h2><p class="mut">The door between ${esc(V(g.vpc).name)} and the internet, in both directions. It maps each public IP to a private one, so only resources with a public IP can use it. Free, and scales by itself.</p>
    <h3>Route tables that point to it</h3>${users.length?lks(users.map(r=>go('rt:'+r.id,r.name))):'<p class="mut">None, so no subnet is public yet.</p>'}`+delB('igw',id,'Detach and delete');
}
function pGwe(id){

  return `<h2>Gateway endpoint</h2><p class="mut">Keeps traffic to ${esc(s.name)} on the AWS private network. It works as a route: the prefix list ${s.pl} points here. Free of charge.</p>
    <h3>Route tables that use it</h3>`+D.rts.filter(r=>r.vpc===e.vpc).map(r=>`<div class="row" style="margin:2px 0">${ck('gwe-rt',r.routes.some(x=>x.target===id),esc(r.name),{id,rt:r.id})}<span class="grow"></span>${go('rt:'+r.id,'Open')}</div>`).join('')+delB('gwe',id,'Delete this endpoint');
}
function pPcx(id){
  const x=D.pcxs.find(q=>q.id===id);if(!x)return '';const a=V(x.a),b=V(x.b);
  const has=v=>D.rts.some(r=>r.vpc===v.id&&r.routes.some(q=>q.target===id));
  return `<h2>VPC peering</h2><p class="mut">A private link between ${esc(a.name)} and ${esc(b.name)}. Each side needs a route to the other’s range, and security groups on both ends still apply. It never forwards traffic on to a third network.</p>
    <ul class="lks"><li>${go('vpc:'+a.id,a.name)} <span class="mut">${has(a)?'has a route to it':'has no route to it yet'}</span></li><li>${go('vpc:'+b.id,b.name)} <span class="mut">${has(b)?'has a route to it':'has no route to it yet'}</span></li></ul>
    <div class="row"><button class="btn" data-b="pcx-routes" data-id="${id}">Add the routes on both sides</button></div>`+delB('pcx',id,'Delete this peering connection');
}
function pTgw(id){
  const t=D.tgws.find(q=>q.id===id);if(!t)return '';

/* ---------- tutorials, templates, scratch, theme ---------- */
function diffEls(a,b){
  const out=[],strip=o=>o==null?'':JSON.stringify(o,(k,v)=>['x','y','w','h'].indexOf(k)>=0?undefined:v);
  [['vpcs','vpc'],['subnets','subnet'],['nodes','node'],['igws','igw'],['gwes','gwe'],['rts','rt'],['sgs','sg'],['nacls','nacl'],['pcxs','pcx'],['tgws','tgw'],['vgws','vgw'],['exts','ext']].forEach(([k,p])=>{
    const old={};(a[k]||[]).forEach(x=>{old[x.id]=strip(x);});
    (b[k]||[]).forEach(x=>{if(old[x.id]!==strip(x))out.push(p+':'+x.id);});
  });
  if(b.cdn&&strip(a.cdn)!==strip(b.cdn))out.push('edge:dns','edge:waf','edge:cdn','edge:cert');
  if(b.api&&strip(a.api)!==strip(b.api))out.push('svc:apigw');
  if(b.onprem&&strip(a.onprem)!==strip(b.onprem))out.push('onprem');
  if(strip(a.s3)!==strip(b.s3))out.push('svc:s3');
  return out;
}
function elName(el){
  const i=el.indexOf(':'),t=i<0?el:el.slice(0,i),id=el.slice(i+1),f=(arr,x)=>(arr.find(q=>q.id===x)||{}).name;
  if(t==='vpc')return f(D.vpcs,id);if(t==='subnet')return 'subnet '+f(D.subnets,id);if(t==='node')return f(D.nodes,id);
  if(t==='rt')return 'route table '+f(D.rts,id);if(t==='sg')return 'security group '+f(D.sgs,id);if(t==='nacl')return 'network ACL '+f(D.nacls,id);
  if(t==='igw')return 'internet gateway';if(t==='gwe'){const e=D.gwes.find(q=>q.id===id);return e?'gateway endpoint for '+E.SVC[e.service].name:'';}
  if(t==='pcx')return 'peering connection';if(t==='tgw')return 'transit gateway '+f(D.tgws,id);if(t==='vgw')return 'VPN gateway';
  if(t==='ext')return f(D.exts,id);if(t==='edge')return {dns:'Route 53',waf:'WAF',cdn:'CloudFront',cert:'Certificate Manager'}[id];
  if(t==='svc')return id==='apigw'?(D.api?D.api.name:'API Gateway'):'S3 bucket settings';if(t==='onprem')return (D.onprem&&D.onprem.name)||'office network';
  return el;
}
function startTut(k){
  const meta=TPLS.find(x=>x.k===k);
  const go2=()=>{
    const r=recordTpl(k);scratch=false;
    tut={k,name:meta.name,steps:r.steps,i:0,hl:[]};
    D=norm(JSON.parse(r.fin));fit();fitted=true;
    goStep(0);
  };
  if(hasStuff()&&!tut)ask({title:'Replace the current design?',intro:'The tutorial builds its design on the canvas, which removes what is there now.',ok:'Start the tutorial',done:()=>{go2();}});
  else go2();
}
function goStep(i){
  if(!tut)return;i=clampv(i,0,tut.steps.length-1);
  stopAnim();disarm();
  const prev=i?JSON.parse(tut.steps[i-1].state):blankD();
  tut.i=i;D=norm(JSON.parse(tut.steps[i].state));tut.hl=diffEls(prev,D);
  sel=null;last=null;tab='tut';save();draw();renderPanel();$('#b-panel').scrollTop=0;lessonSync();chkHide();
}
function pTut(){
  const s=tut.steps[tut.i],n=tut.steps.length,lastStep=tut.i===n-1,names=[...new Set(tut.hl.map(elName).filter(Boolean))];
  let h=`<p class="mut sm" style="margin:0">${tut.lesson?'Lesson':'Step by step'}: ${esc(tut.name)}</p><div class="tut-prog" aria-hidden="true"><i style="width:${(tut.i+1)/n*100}%"></i></div>
    <p class="sm mut" style="margin:0 0 2px">Step ${tut.i+1} of ${n}</p><h2>${esc(s.title)}</h2>
    <h3>What it is</h3><p>${esc(s.what)}</p><h3>Why it’s here</h3><p>${esc(s.why)}</p>`;
  if(names.length&&!lastStep)h+=`<p class="sm"><span class="mut">Added or changed in this step, outlined on the canvas:</span> ${tut.hl.filter((el,j,a)=>a.findIndex(x=>elName(x)===elName(el))===j&&elName(el)).slice(0,10).map(el=>go(el,elName(el))).join(', ')}</p>`;
  if(s.tries.length){
    h+='<h3>Try it</h3><div class="tut-tries">'+s.tries.map((x,j)=>`<button class="btn" data-b="tut-try" data-i="${j}">${esc(x.label)}</button>`).join('')+'</div>';
    if(last&&last.tutStep===tut.i){
      const r=last.res;
      if(play.running)h+=`<div class="b-res"><b>${esc(tLabel(last.test))}</b>Follow the packet on the canvas.${play.mode==='step'?'<div class="row" style="margin-bottom:0"><button class="btn primary" data-b="next-hop">Next hop</button></div>':''}</div>`;
      else h+=`<div class="b-res ${r.ok?'ok':'no'}"><b>${esc(r.title)}</b>${r.ok?'':(r.phase==='rep'?'The request arrived, but its reply was lost. ':'')}${esc(r.text)}<div class="row" style="margin-bottom:0"><button class="btn" data-b="tab" data-v="test">See every hop</button></div></div>`;
    }
  }
  if(lastStep&&D.tests.length)h+=`<div class="row"><button class="btn" data-b="tab" data-v="test">See the saved checks</button></div>`;
  h+=`<div class="tut-nav">${tut.i?'<button class="btn" data-b="tut-back">Back</button>':'<span></span>'}${lastStep?'<button class="btn primary" data-b="tut-finish">'+(tut.lesson?(nextLesson()?'Next lesson: '+esc(nextLesson()[1]):'Finish'):'Finish')+'</button>':'<button class="btn primary" data-b="tut-next">Next step</button>'}</div>`;
  h+='<h3>All steps</h3><ol class="tut-steps">'+tut.steps.map((x,j)=>`<li class="${j<tut.i?'done':j===tut.i?'cur':''}"><button data-b="tut-go" data-i="${j}">${esc(x.title)}</button></li>`).join('')+'</ol>';
  h+=tut.lesson?`<p class="mut sm" style="margin-top:12px">Each step rebuilds the network up to that point, so changes you make on the canvas are replaced when you move to another step.</p>`:`<p class="mut sm" style="margin-top:12px">Each step rebuilds the design up to that point, so changes you make on the canvas are replaced when you move to another step. To keep them, leave the tutorial.</p><button class="lk sm" data-b="tut-exit">Leave the tutorial and keep this design</button>`;
  return h;
}
function tplCards(){
  return TPLS.map(t=>`<div class="tpl"><div class="tpl-h"><b>${esc(t.name)}</b><span class="tpl-l">${t.level}</span></div><p class="mut sm">${esc(t.desc)}</p><div class="row"><button class="btn primary" data-b="tut" data-v="${t.k}">Build it step by step</button><button class="btn" data-b="tpl" data-v="${t.k}">Open the finished design</button></div></div>`).join('');
}
function openTemplates(){
  const dlg=$('#b-dlg');dlg.className='wide';dlg._o=null;
  dlg.innerHTML=`<div class="in"><h2>Templates</h2><p class="mut">Build a design step by step, with an explanation of every part and a test to try at each stage. Or open the finished design and explore it yourself.</p>${tplCards()}<div class="acts"><button class="btn" data-b="dlg-x">Close</button></div></div>`;
  if(!dlg.open){if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');}
}
function startScratch(){
  const go3=()=>{tut=null;D=blankD();sel=null;last=null;scratch=true;tab='props';commit();fit();arm('vpc');};
  if(hasStuff())ask({title:'Start a new design?',intro:'This removes the design on the canvas now, including its saved checks. Use “Copy design” first if you want to keep it.',ok:'Start from scratch',done:()=>{go3();}});
  else go3();
}
function renderEmpty(){
  $('#b-empty').innerHTML=`<div><h2>Design a network</h2><p>Start with an empty canvas and drag in the parts you need, or pick a template. Every template can be built step by step, with an explanation of each part.</p>
    <div class="row"><button class="btn primary" data-b="scratch">Start from scratch</button><button class="btn" data-b="templates">Browse templates</button></div>
    <h3>Learn by building</h3><ul class="lks">${TPLS.map(t=>`<li><button class="lk" data-b="tut" data-v="${t.k}">${esc(t.name)}</button> <span class="mut sm">${t.level}</span></li>`).join('')}</ul></div>`;
}
function setDim(v){
  document.documentElement.classList.toggle('iso',v!=='2d');
  try{localStorage.setItem('ftp-dim2',v==='2d'?'2d':'3d');}catch(e){}
  $$('#dimsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===(v==='2d'?'2d':'3d'))));
  if(window.FTP&&window.FTP.redraw)window.FTP.redraw();
  stopAnim();draw();
  if(dv())fit();else fitted=false;
  renderPanel();
}
function setTheme(v){
  const r=document.documentElement;
  if(v==='light'||v==='dark')r.dataset.theme=v;else{delete r.dataset.theme;v='auto';}
  try{localStorage.setItem('ftp-theme2',v);}catch(e){}
  $$('#themesw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
}
{let tv='light';try{tv=localStorage.getItem('ftp-theme2')||'light';}catch(e){}setTheme(tv);}
renderEmpty();
{let fv='on';try{fv=localStorage.getItem('ftp-follow')||'on';}catch(e){}setFollow(fv!=='off');}
$$('#dimsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===(isIso()?'3d':'2d'))));

/* ---------- switching between the tour and the designer ---------- */
function setMode(m,fromHash){
  if(m==='design'&&svcMode)exitLesson();
  document.body.dataset.view=m;
  $$('#viewsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===m)));
  if(m==='design'){
    if(!fromHash){learnHash=location.hash.slice(1)||'overview';try{location.hash='designer';}catch(e){}}
    requestAnimationFrame(()=>{if(!fitted){fit();fitted=true;}else setView();draw();renderPanel();});
  }else if(!fromHash){try{location.hash=learnHash||'overview';}catch(e){}}
}
window.addEventListener('hashchange',()=>{const d=location.hash==='#designer';if(d!==(document.body.dataset.view==='design'))setMode(d?'design':'learn',true);});
D=load()||blankD();
draw();renderPanel();
if(location.hash==='#designer')setMode('design',true);
window.FTPD={get D(){return D;},simulate:t=>E.simulate(D,t)};
})();
</script>
